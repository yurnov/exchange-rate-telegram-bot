name: exchange-rate-telegram-bot
services:
  backup:
    image: ghcr.io/yurnov/xratebot-backup:dev
    container_name: exchange-rate-bot-backup
    depends_on:
      - bot
    volumes:
      - ./data:/bot/data:ro
      # Staging area for the snapshot. A named volume keeps the multi-hundred-megabyte
      # temporary file on a real filesystem instead of the container layer, and keeps
      # the status/log files readable after the container exits.
      - backup-work:/backup/work
    environment:
      BACKUP_TMPDIR: /backup/work
      BACKUP_STATUS_FILE: /backup/work/last_backup.json
      BACKUP_LOG_FILE: /backup/work/backup.log
    env_file: .env.backup
    restart: unless-stopped
    # Resource caps sized for a 512 MiB / 1 shared vCPU host: a backup can no longer
    # take the whole box down with it. If it does not fit, it is OOM-killed inside its
    # own cgroup while the bot and sshd keep running. Raise these on larger hosts.
    # Page cache counts towards mem_limit, so leave room to stream the snapshot
    # through without forcing the cgroup into constant reclaim.
    cpus: 0.75
    mem_limit: 320m
    memswap_limit: 320m
    pids_limit: 64
    # If the *host* (not the cgroup) runs out of memory mid-backup, prefer killing
    # the backup over the bot or sshd. A lost backup cycle retries; a lost bot drops
    # user traffic.
    oom_score_adj: 500
    profiles:
      - backup
  bot:
    image: ghcr.io/yurnov/xratebot:dev
    container_name: exchange-rate-bot
    volumes:
      - ./data:/bot/data
    env_file: .env
    restart: unless-stopped
    # Leak guard, not a working-set budget: the bot needs well under 100 MiB, so a
    # runaway process hits its own cgroup limit (and restarts) instead of dragging
    # the whole 512 MiB host into the OOM killer.
    mem_limit: 192m
volumes:
  backup-work: {}
