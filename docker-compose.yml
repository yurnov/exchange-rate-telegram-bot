version: '3.8'

services:
  bot:
    image: ghcr.io/yurnov/xratebot:latest
    container_name: exchange-rate-bot
    env_file: .env
    volumes:
      - ./data:/bot/data
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PULL_INTERVAL=${PULL_INTERVAL:-300}
      - LOG_RATE=${LOG_RATE:-False}
      - DB_ENABLED=${DB_ENABLED:-False}
      - DB_PATH=${DB_PATH:-data/exchange_rates.db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
