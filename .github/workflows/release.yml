name: Release image to GHCR
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-tags: True

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install linters
        run: |
          python -m pip install pylint==4.0.4 black==25.11.0

      - name: Lint Python code with black
        run: |
          black --check --skip-string-normalization --line-length 120 bot;

      - name: Lint Python code with pylint
        run: |
          find . -name *.py -exec pylint --disable=R,C,W1203 '{}' \;

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008,SC3009,DL3013

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

      - name: Update docker-compose.yml with new version
        if: steps.tag_version.outputs.new_tag != null
        run: |
          sed -i -E 's|ghcr\.io/yurnov/xratebot:v[0-9]+\.[0-9]+\.[0-9]+|ghcr.io/yurnov/xratebot:${{ steps.tag_version.outputs.new_tag }}|g' docker-compose.yml
          sed -i -E 's|ghcr\.io/yurnov/xratebot:dev|ghcr.io/yurnov/xratebot:${{ steps.tag_version.outputs.new_tag }}|g' docker-compose.yml

      - name: Commit changes
        if: steps.tag_version.outputs.new_tag != null
        id: commit_changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Release ${{ steps.tag_version.outputs.new_tag }}"
          file_pattern: docker-compose.yml

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        # do this step only on push to main and do not run for pull request
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and push to registry
        if: steps.tag_version.outputs.new_tag != null
        uses: docker/build-push-action@v6
        with:
          context: .
          # push to registry when merge to main
          push: ${{ github.ref == 'refs/heads/main' }}
          no-cache: true
          tags: |
            ghcr.io/yurnov/xratebot:latest
            ghcr.io/yurnov/xratebot:${{ steps.tag_version.outputs.new_tag }}
          build-args: |
            VERSION=${{ steps.tag_version.outputs.new_tag }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            GIT_COMMIT=${{ steps.commit_changes.outputs.commit_hash }}
